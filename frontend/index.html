<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6b4fa0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASTRA">
    <link rel="apple-touch-icon" href="astra.jpg">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app">

        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="avatar-area">
                <div class="avatar-img-wrap">
                    <img
                        id="avatar-img"
                        src="astra.jpg"
                        alt="ASTRA"
                        onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';"
                    >
                    <div class="avatar-fallback" id="avatar-fallback">A</div>
                </div>
            </div>

            <div class="panel-info">
                <div class="panel-name" id="panel-name">ASTRA</div>
                <div class="panel-status" id="status-text">● online</div>
            </div>

            <div class="panel-stats">
                <div class="stat-row">
                    <span class="stat-label">LEVEL</span>
                    <span class="stat-value" id="state-level">1 · Lodowa Ściana</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">XP</span>
                    <span class="stat-value" id="state-xp">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">MOOD</span>
                    <span class="stat-value" id="state-mood">neutral</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">PAMIĘĆ</span>
                    <span class="stat-value" id="memory-badge">⬡ 0</span>
                </div>
            </div>

            <div class="panel-version">v0.2</div>
        </div>

        <!-- RIGHT: CHAT -->
        <div class="chat-area">

            <!-- HEADER (wąski, tylko mobilny fallback) -->
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="chat-header-avatar">
                        <img id="header-avatar-img" src="astra.jpg" alt="ASTRA" onerror="this.style.display='none'">
                    </div>
                    <div class="chat-header-info">
                        <span class="chat-header-name" id="chat-header-name">ASTRA</span>
                        <span class="chat-header-status" id="chat-status-mobile">● online</span>
                        <span class="chat-header-level" id="mobile-level">lvl 1 · XP 0</span>
                        <span class="mode-badge" id="mode-badge"></span>
                    </div>
                </div>
            </div>

            <!-- MESSAGES -->
            <div class="messages" id="messages">
                <div class="system-msg">Nowa rozmowa. Wszystko co powiesz zostanie zapamiętane.</div>
            </div>

            <!-- INPUT -->
            <div class="input-area">
                <textarea
                    id="input"
                    placeholder="Napisz coś..."
                    rows="1"
                    enterkeyhint="enter"
                    autofocus
                ></textarea>
                <input type="file" id="image-input" accept="image/*" style="display:none">
                <button id="attach-btn" class="io-btn" onclick="document.getElementById('image-input').click()" title="Pokaż zdjęcie">📎</button>
                <button id="mic-btn" class="io-btn" onclick="toggleMic()" title="Nagraj głosem">🎤</button>
                <button id="voice-btn" class="io-btn" onclick="toggleVoice()" title="Głos Astry">🔊</button>

                <!-- Tryby: widoczne na pasku TYLKO gdy włączone (CSS ukrywa :not(.active)).
                     Włączasz je z menu ⋯, wyłączasz klikając świecący przycisk. -->
                <button id="scen-btn" class="io-btn" onclick="toggleScenariuszMode()" title="Tryb scenariusza">🎬</button>
                <button id="pause-btn" class="io-btn" onclick="toggleExtractionPause()" title="Tryb roboczy">⏸</button>

                <div class="io-more">
                    <button id="more-btn" class="io-btn" onclick="toggleMoreMenu(event)" title="Więcej">⋯</button>
                    <div class="io-menu" id="io-menu">
                        <button onclick="startNewConversation(); closeMoreMenu()">✨&nbsp;&nbsp;Nowa rozmowa</button>
                        <button onclick="toggleScenariuszMode(); closeMoreMenu()">🎬&nbsp;&nbsp;Tryb scenariusza</button>
                        <button onclick="toggleExtractionPause(); closeMoreMenu()">⏸&nbsp;&nbsp;Tryb roboczy (bez zapisu)</button>
                    </div>
                </div>

                <button id="send-btn" onclick="sendMessage()">→</button>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
</body>
</html>
