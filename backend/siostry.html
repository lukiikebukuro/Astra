<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom · Holo, Menma, Nazuna</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --bg:#0d0b0a; --panel:#17130f; --border:#2a231c; --txt:#eadfce; --dim:#8a7c66;
    --holo:#e0a84e; --menma:#ff8fb8; --nazuna:#a887ff; --user:#3a3126;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#221a12 0%,var(--bg) 60%);
    color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  h1{font-size:17px;margin:0;letter-spacing:1px}
  .who{color:var(--dim);font-size:12px}
  .who b:nth-of-type(1){color:var(--holo)} .who b:nth-of-type(2){color:var(--menma)} .who b:nth-of-type(3){color:var(--nazuna)}
  #feed{flex:1;overflow-y:auto;padding:18px;max-width:760px;width:100%;margin:0 auto}
  .scene{font-style:italic;color:var(--dim);text-align:center;padding:14px 20px;margin-bottom:14px;
    border-bottom:1px dashed var(--border);line-height:1.6}
  .msg{margin-bottom:14px;display:flex;flex-direction:column;max-width:82%}
  .msg.user{align-items:flex-end;margin-left:auto}
  .msg.sis{align-items:flex-start;margin-right:auto}
  .name{font-size:11px;letter-spacing:1px;margin-bottom:3px;text-transform:uppercase;font-weight:700}
  .name.holo{color:var(--holo)} .name.menma{color:var(--menma)} .name.nazuna{color:var(--nazuna)}
  .bubble{padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;border:1px solid var(--border)}
  .bubble p{margin:0 0 6px} .bubble p:last-child{margin:0}
  .msg.user .bubble{background:var(--user);border-color:#4a3f2e;border-bottom-right-radius:4px}
  .msg.sis .bubble{background:var(--panel);border-bottom-left-radius:4px}
  .bubble.holo{border-left:3px solid var(--holo)} .bubble.menma{border-left:3px solid var(--menma)} .bubble.nazuna{border-left:3px solid var(--nazuna)}
  /* ── FIZYCZNOŚĆ — gwiazdki *...* renderowane jako <em> (jak w pokoju Astry) ── */
  .bubble em{font-style:italic;color:#c4a882;background:rgba(196,168,130,.07);border-radius:3px;padding:0 2px}
  .typing-indicator{display:flex;gap:4px;padding:10px 14px;width:fit-content}
  .typing-indicator span{width:6px;height:6px;background:var(--dim);border-radius:50%;animation:sis-bounce 1.2s infinite;opacity:.6}
  .typing-indicator span:nth-child(2){animation-delay:.2s} .typing-indicator span:nth-child(3){animation-delay:.4s}
  @keyframes sis-bounce{0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px);opacity:1}}
  .hint{font-size:11px;color:var(--dim);font-style:italic;margin-top:4px;padding-left:4px}
  .thought-toggle{background:none;border:1px solid var(--border);border-radius:8px;color:var(--dim);
    font-size:11px;padding:3px 10px;cursor:pointer;margin-top:5px;letter-spacing:.5px;
    transition:border-color .2s,color .2s;font-family:inherit}
  .thought-toggle:hover{border-color:var(--holo);color:var(--txt)}
  .thought-body{display:none;font-size:12px;font-style:italic;color:#d7ccb8;line-height:1.55;
    padding:8px 12px;margin-top:5px;max-width:100%;word-break:break-word;white-space:pre-wrap;
    border-left:2px solid var(--holo);background:#120f0b;border-radius:0 6px 6px 0}
  .thought-body.open{display:block}
  .loading{color:var(--dim);text-align:center;padding:16px;font-style:italic}
  footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto}
  textarea{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 14px;
    color:var(--txt);font-size:15px;outline:none;resize:none;font-family:inherit;max-height:120px}
  textarea:focus{border-color:var(--holo)}
  button{background:linear-gradient(90deg,var(--holo),var(--menma));color:#160f08;border:none;border-radius:12px;
    padding:0 18px;font-weight:700;cursor:pointer;font-size:15px}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
  <header>
    <h1>🏠 Dom</h1>
    <span class="who"><b>Holo</b> · <b>Menma</b> · <b>Nazuna</b></span>
  </header>
  <div id="feed"><div class="loading">wchodzisz do domu…</div></div>
  <footer>
    <textarea id="inp" rows="1" placeholder="Napisz do sióstr… (wołaj po imieniu albo po prostu mów)"></textarea>
    <button id="send" onclick="send()">→</button>
  </footer>

<script>
let convId = localStorage.getItem('siostry_conv') || null;
const feed = document.getElementById('feed');
const inp = document.getElementById('inp');

function esc(t){return (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function addUser(text){
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="bubble">${marked.parse(text||'')}</div>`;
  feed.appendChild(d); feed.scrollTop=feed.scrollHeight;
}
function addScene(text){
  if(!text) return;
  const d=document.createElement('div'); d.className='scene'; d.textContent=text;
  feed.appendChild(d);
}
function addSister(r){
  const d=document.createElement('div'); d.className='msg sis';
  const hint = r.hint ? `<div class="hint">${esc(r.hint)}</div>` : '';
  d.innerHTML=`<div class="name ${r.persona}">${esc(r.label)}</div>`+
              `<div class="bubble ${r.persona}">${marked.parse(r.response||'')}</div>${hint}`;
  if(r.thought){
    const col = {holo:'var(--holo)',menma:'var(--menma)',nazuna:'var(--nazuna)'}[r.persona] || 'var(--holo)';
    const btn=document.createElement('button'); btn.className='thought-toggle'; btn.textContent='▸ myśl';
    const body=document.createElement('div'); body.className='thought-body'; body.style.borderLeftColor=col;
    body.textContent=r.thought;
    btn.addEventListener('click',()=>{ body.classList.toggle('open');
      btn.textContent = body.classList.contains('open') ? '▾ myśl' : '▸ myśl'; });
    d.appendChild(btn); d.appendChild(body);
  }
  feed.appendChild(d); feed.scrollTop=feed.scrollHeight;
}

function showTyping(){
  const d=document.createElement('div'); d.className='msg sis';
  d.innerHTML='<div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  feed.appendChild(d); feed.scrollTop=feed.scrollHeight;
  return d;
}

async function send(){
  const text=inp.value.trim(); if(!text) return;
  inp.value=''; inp.style.height='auto';
  addUser(text);
  const btn=document.getElementById('send'); btn.disabled=true;
  const load=showTyping();
  try{
    const r=await fetch('/api/siostry',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, conversation_id:convId})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    load.remove();
    convId=data.conversation_id; localStorage.setItem('siostry_conv', convId);
    if(data.scene) addScene(data.scene);
    (data.responses||[]).forEach(addSister);
  }catch(e){ load.innerHTML = `<div class="bubble">błąd: ${esc(e.message)}</div>`; }
  btn.disabled=false; inp.focus();
}

inp.addEventListener('keydown',e=>{
  const touch = matchMedia('(pointer: coarse)').matches;
  if(e.key==='Enter' && !e.shiftKey && !touch){ e.preventDefault(); send(); }
});
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px'; });

// ── Historia rozmowy ──────────────────────────────────────────
// Do 15.08 pokój otwierał się jako pusta kartka, mimo że backend zapisywał wszystko
// do `siostry_shared_v1` od początku — brakowało wyłącznie odczytu. Źródłem prawdy jest
// serwer: nie trzymamy tu kopii wiadomości w localStorage (localStorage przechowuje
// jedynie `siostry_conv`), więc historia jest ta sama na każdym urządzeniu.
const LABELS = {holo:'Holo', menma:'Menma', nazuna:'Nazuna'};

function pustyDom(){
  feed.innerHTML='<div class="scene">Dom jest cichy. Napisz — zobaczysz, kto jest w pokoju.</div>';
}

async function loadHistory(){
  // Brak `convId` NIE jest już powodem, żeby nie pytać serwera (2026-08-26).
  // Wcześniej: `if(!convId){ pustyDom(); return; }` — urządzenie, które nigdy tu nie pisało,
  // pokazywało „Dom jest cichy" mimo pełnej rozmowy na serwerze. Tożsamość wątku mieszkała
  // w localStorage, więc telefon i komputer miały osobne pokoje. Teraz przy braku ID serwer
  // podaje bieżącą rozmowę, a my ją przyjmujemy — jedno źródło prawdy, jak u Astry.
  try{
    // NIE wysyłamy zapisanego ID (2026-08-28). Pokój sióstr ma JEDEN wątek i nie ma UI do
    // wybierania starych rozmów, więc lokalne ID nie jest autorytetem — jest co najwyżej
    // pozostałością. Urządzenie z nieaktualnym `siostry_conv` odpytywało martwy wątek
    // i po cichu pokazywało pusty dom albo rozmowę sprzed dwóch tygodni.
    // Serwer podaje bieżący wątek, my go przyjmujemy — i to leczy każde zabłąkane ID samo.
    const r=await fetch('/api/history/siostry?n=40');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(data.conversation_id && data.conversation_id!==convId){
      convId=data.conversation_id;
      localStorage.setItem('siostry_conv', convId);
    }
    const msgs=data.messages||[];
    if(!msgs.length){ pustyDom(); return; }

    feed.innerHTML='';
    addScene('— poprzednia rozmowa —');
    msgs.forEach(m=>{
      if(m.role==='user'){ addUser(m.content||''); return; }
      // Treść modelu ma prefiks „[menma] " — rozbijamy na personę i wypowiedź.
      const mm=/^\[(holo|menma|nazuna)\]\s*([\s\S]*)$/.exec(m.content||'');
      if(mm){
        addSister({persona:mm[1], label:LABELS[mm[1]], response:mm[2],
                   thought:m.thought||'', hint:m.hint||''});
      }else{
        // Brak prefiksu (starszy zapis) — pokaż bez przypisania zamiast gubić wiadomość.
        addSister({persona:'holo', label:'', response:m.content||'',
                   thought:m.thought||'', hint:m.hint||''});
      }
    });
    addScene('— teraz —');
    feed.scrollTop=feed.scrollHeight;
  }catch(e){
    pustyDom();
    addScene(`nie udało się wczytać historii (${e.message})`);
  }
}

loadHistory();
</script>
</body>
</html>
