<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom · Holo, Menma, Nazuna</title>
<style>
  :root{
    --bg:#0d0b0a; --panel:#17130f; --border:#2a231c; --txt:#eadfce; --dim:#8a7c66;
    --holo:#e0a84e; --menma:#ff8fb8; --nazuna:#a887ff; --user:#3a3126;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#221a12 0%,var(--bg) 60%);
    color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  h1{font-size:17px;margin:0;letter-spacing:1px}
  .who{color:var(--dim);font-size:12px}
  .who b:nth-of-type(1){color:var(--holo)} .who b:nth-of-type(2){color:var(--menma)} .who b:nth-of-type(3){color:var(--nazuna)}
  #feed{flex:1;overflow-y:auto;padding:18px;max-width:760px;width:100%;margin:0 auto}
  .scene{font-style:italic;color:var(--dim);text-align:center;padding:14px 20px;margin-bottom:14px;
    border-bottom:1px dashed var(--border);line-height:1.6}
  .msg{margin-bottom:14px;display:flex;flex-direction:column;max-width:82%}
  .msg.user{align-items:flex-end;margin-left:auto}
  .msg.sis{align-items:flex-start;margin-right:auto}
  .name{font-size:11px;letter-spacing:1px;margin-bottom:3px;text-transform:uppercase;font-weight:700}
  .name.holo{color:var(--holo)} .name.menma{color:var(--menma)} .name.nazuna{color:var(--nazuna)}
  .bubble{padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;border:1px solid var(--border)}
  .msg.user .bubble{background:var(--user);border-color:#4a3f2e;border-bottom-right-radius:4px}
  .msg.sis .bubble{background:var(--panel);border-bottom-left-radius:4px}
  .bubble.holo{border-left:3px solid var(--holo)} .bubble.menma{border-left:3px solid var(--menma)} .bubble.nazuna{border-left:3px solid var(--nazuna)}
  .hint{font-size:11px;color:var(--dim);font-style:italic;margin-top:4px;padding-left:4px}
  .loading{color:var(--dim);text-align:center;padding:16px;font-style:italic}
  footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto}
  textarea{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 14px;
    color:var(--txt);font-size:15px;outline:none;resize:none;font-family:inherit;max-height:120px}
  textarea:focus{border-color:var(--holo)}
  button{background:linear-gradient(90deg,var(--holo),var(--menma));color:#160f08;border:none;border-radius:12px;
    padding:0 18px;font-weight:700;cursor:pointer;font-size:15px}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
  <header>
    <h1>🏠 Dom</h1>
    <span class="who"><b>Holo</b> · <b>Menma</b> · <b>Nazuna</b></span>
  </header>
  <div id="feed"><div class="loading">wchodzisz do domu…</div></div>
  <footer>
    <textarea id="inp" rows="1" placeholder="Napisz do sióstr… (wołaj po imieniu albo po prostu mów)"></textarea>
    <button id="send" onclick="send()">→</button>
  </footer>

<script>
let convId = localStorage.getItem('siostry_conv') || null;
const feed = document.getElementById('feed');
const inp = document.getElementById('inp');

function esc(t){return (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function addUser(text){
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="bubble">${esc(text)}</div>`;
  feed.appendChild(d); feed.scrollTop=feed.scrollHeight;
}
function addScene(text){
  if(!text) return;
  const d=document.createElement('div'); d.className='scene'; d.textContent=text;
  feed.appendChild(d);
}
function addSister(r){
  const d=document.createElement('div'); d.className='msg sis';
  const hint = r.hint ? `<div class="hint">${esc(r.hint)}</div>` : '';
  d.innerHTML=`<div class="name ${r.persona}">${esc(r.label)}</div>`+
              `<div class="bubble ${r.persona}">${esc(r.response)}</div>${hint}`;
  feed.appendChild(d); feed.scrollTop=feed.scrollHeight;
}

async function send(){
  const text=inp.value.trim(); if(!text) return;
  inp.value=''; inp.style.height='auto';
  addUser(text);
  const btn=document.getElementById('send'); btn.disabled=true;
  const load=document.createElement('div'); load.className='loading'; load.textContent='…'; feed.appendChild(load); feed.scrollTop=feed.scrollHeight;
  try{
    const r=await fetch('/api/siostry',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, conversation_id:convId})});
    load.remove();
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    convId=data.conversation_id; localStorage.setItem('siostry_conv', convId);
    if(data.scene) addScene(data.scene);
    (data.responses||[]).forEach(addSister);
  }catch(e){ load.textContent='błąd: '+esc(e.message); }
  btn.disabled=false; inp.focus();
}

inp.addEventListener('keydown',e=>{
  const touch = matchMedia('(pointer: coarse)').matches;
  if(e.key==='Enter' && !e.shiftKey && !touch){ e.preventDefault(); send(); }
});
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px'; });
feed.innerHTML='<div class="scene">Dom jest cichy. Napisz — zobaczysz, kto jest w pokoju.</div>';
</script>
</body>
</html>
